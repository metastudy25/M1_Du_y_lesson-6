<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDEN Grammar Lab · 중1 Lesson 6</title>
<style>
:root{
  --bg:#f5f3ee;--card:#ffffff;--ink:#18202f;--sub:#5b6374;--mute:#8d93a0;
  --line:#e3e0d8;--line2:#efede7;
  --navy:#16213a;--navy2:#24345a;--accent:#2b59c3;--accent-d:#1e429a;--accent-soft:#e9eefb;
  --gold:#c49a3c;--gold-soft:#f7efdc;
  --ok:#1d8656;--ok-soft:#e6f4ec;--no:#c4413a;--no-soft:#fbeceb;
  --font:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:var(--font);color:var(--ink);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;letter-spacing:-.2px}
button,input{font-family:var(--font);font-size:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:none;background:none}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 56px}
.hidden{display:none!important}

/* header */
.hdr{position:sticky;top:0;z-index:20;background:rgba(245,243,238,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hdr-in{max-width:860px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.mark{width:30px;height:30px;border-radius:8px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
.brand b{font-size:15px;font-weight:800;letter-spacing:-.3px}
.brand span{font-size:12px;color:var(--mute);display:block;line-height:1.2}
.hdr-actions{display:flex;gap:6px}
.lnk{padding:7px 12px;border-radius:8px;font-size:13px;color:var(--sub);font-weight:700}
.lnk:hover{background:#ebe8e1;color:var(--ink)}

/* buttons */
.btn{padding:12px 20px;border-radius:10px;font-weight:700;font-size:15px;transition:background .15s,transform .08s}
.btn:active{transform:scale(.98)}
.btn-pri{background:var(--navy);color:#fff}
.btn-pri:hover{background:var(--navy2)}
.btn-sec{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn-sec:hover{border-color:#cfcbc1}
.btn[disabled]{opacity:.4;cursor:default}

/* hero */
.hero{margin-top:20px;background:var(--navy);color:#f4f1ea;border-radius:18px;padding:28px 26px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:1px solid rgba(255,255,255,.08);box-shadow:0 0 0 30px rgba(255,255,255,.025),0 0 0 60px rgba(255,255,255,.02)}
.eyebrow{font-size:12px;letter-spacing:.5px;color:#a9b4cc;font-weight:700}
.hero h1{font-size:26px;font-weight:800;letter-spacing:-.8px;margin:6px 0 12px;line-height:1.3}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:5px 10px;border-radius:99px;border:1px solid rgba(255,255,255,.18);color:#dfe5f2}
.chip.on{background:var(--gold);border-color:var(--gold);color:#1b1b1b;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:14px}
.kpi{background:#fff;padding:14px 16px}
.kpi .k{font-size:12px;color:var(--mute);font-weight:700}
.kpi .v{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-top:2px}
.kpi .v small{font-size:13px;color:var(--mute);font-weight:700;margin-left:2px}

/* stages */
.sec-title{font-size:13px;color:var(--mute);font-weight:800;margin:26px 2px 10px;letter-spacing:.3px}
.stages{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.st{width:100%;display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:12px;padding:16px 18px;text-align:left;border-bottom:1px solid var(--line2);transition:background .12s}
.st:last-child{border-bottom:none}
.st:hover{background:#faf9f6}
.st .no{font-size:22px;font-weight:800;color:#c9c5bb;letter-spacing:-.5px}
.st.done .no{color:var(--accent)}
.st h3{font-size:16px;font-weight:800;letter-spacing:-.3px}
.st p{font-size:13px;color:var(--sub);line-height:1.5;margin-top:1px}
.st .rt{text-align:right;min-width:82px}
.st .pct{font-size:13px;font-weight:800;color:var(--ink)}
.st .pct.none{color:var(--mute);font-weight:700}
.mbar{height:4px;background:var(--line2);border-radius:99px;overflow:hidden;margin-top:6px;width:82px;margin-left:auto}
.mbar div{height:100%;background:var(--accent);border-radius:99px}
.wrong-row{margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.wrong-row b{font-size:15px}
.wrong-row span{font-size:13px;color:var(--sub);display:block}

/* page header */
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:24px 0 14px;flex-wrap:wrap}
.phead .eyebrow{color:var(--mute)}
.phead h2{font-size:22px;font-weight:800;letter-spacing:-.6px;line-height:1.3}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.stat{font-size:12px;font-weight:700;padding:6px 10px;border-radius:8px;background:#fff;border:1px solid var(--line);color:var(--sub)}
.stat b{color:var(--ink)}
.track{height:3px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:16px}
.track div{height:100%;background:var(--accent);transition:width .3s}

/* card */
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px}
.qno{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--accent)}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--line2);color:var(--sub)}
.tag.gold{background:var(--gold-soft);color:#8a6a1f}
.tag.red{background:var(--no-soft);color:var(--no)}
.qtext{font-size:17px;font-weight:700;line-height:1.65;margin:10px 0 14px;white-space:pre-line;letter-spacing:-.3px}
.qbox{background:#faf9f6;border:1px solid var(--line);border-left:3px solid var(--navy);border-radius:10px;padding:14px 16px;font-size:15px;line-height:1.85;margin-bottom:16px;white-space:pre-line}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;text-align:left;padding:13px 15px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:15px;line-height:1.55;white-space:pre-line;transition:border-color .12s,background .12s}
.opt:hover:not([disabled]){border-color:#bfc8dc;background:#fbfcfe}
.opt .m{font-weight:800;color:var(--mute);min-width:18px;flex-shrink:0}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .m{color:var(--accent)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .m{color:var(--ok)}
.opt.wrong{border-color:var(--no);background:var(--no-soft)}
.opt.wrong .m{color:var(--no)}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;font-weight:800;color:var(--sub);margin-bottom:5px}
.fld input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff;outline:none;transition:border-color .12s}
.fld input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fld input.ok{border-color:var(--ok);background:var(--ok-soft)}
.fld input.no{border-color:var(--no);background:var(--no-soft)}
.fb{margin-top:16px;border-radius:12px;padding:15px 16px;font-size:14px;line-height:1.75;border:1px solid}
.fb.good{background:var(--ok-soft);border-color:#bfe3cf}
.fb.bad{background:var(--no-soft);border-color:#f0c9c6}
.fb .h{font-weight:800;font-size:15px;margin-bottom:3px}
.fb.good .h{color:var(--ok)}.fb.bad .h{color:var(--no)}
.fb .a{font-weight:800}
.fb .exp{color:var(--sub);margin-top:4px}
.acts{display:flex;justify-content:space-between;gap:8px;margin-top:18px;flex-wrap:wrap}
.acts .r{display:flex;gap:8px;margin-left:auto}

/* concept */
.cpt p{margin-bottom:10px}
.cpt h4{font-size:14px;font-weight:800;margin:14px 0 6px}
.ex{background:#faf9f6;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0 12px;font-size:14.5px;line-height:1.85}
.ex .lbl{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:5px;background:var(--line2);color:var(--sub);margin-right:6px;vertical-align:1px}
.ex .lbl.acc{background:var(--navy);color:#fff}
.ex s{color:var(--mute)}
.ok-t{color:var(--ok);font-weight:800}.no-t{color:var(--no);font-weight:800}
.hl{color:var(--accent);font-weight:800}
.note{font-size:14px;color:var(--sub);background:var(--gold-soft);border-radius:10px;padding:10px 13px;margin:8px 0}
.warn-box{font-size:14px;background:var(--no-soft);border-radius:10px;padding:10px 13px;margin:8px 0;color:#7a2a26}
.tw{overflow-x:auto;margin:6px 0 12px;border:1px solid var(--line);border-radius:10px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px;min-width:400px}
table.t th{background:#f3f1ec;text-align:left;font-weight:800;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top;line-height:1.6}
table.t tr:last-child td{border-bottom:none}
.chk{margin-top:16px;border-top:1px solid var(--line2);padding-top:14px}
.chk .q{font-size:14px;font-weight:800;margin-bottom:8px}
.chk .q:before{content:"CHECK";font-size:10px;font-weight:800;color:#fff;background:var(--accent);padding:2px 6px;border-radius:4px;margin-right:8px;vertical-align:2px}
.chk .row{display:flex;gap:6px;flex-wrap:wrap}
.chk button{padding:8px 13px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-weight:700;background:#fff}
.chk button.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.chk button.no{border-color:var(--no);background:var(--no-soft);color:var(--no)}
.chk .msg{font-size:13px;margin-top:6px;color:var(--sub)}
.dots{display:flex;gap:4px;justify-content:center;margin:16px 0 0}
.dots span{width:6px;height:6px;border-radius:99px;background:#d6d2c8;transition:width .2s}
.dots span.on{width:20px;background:var(--navy)}
.ctabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.ctab{padding:7px 13px;border-radius:8px;border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--sub);background:#fff;transition:all .12s}
.ctab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.sec-tabs{display:flex;gap:1px;background:var(--line);border-radius:12px 12px 0 0;overflow:hidden}
.sec-tab{flex:1;padding:11px 8px;font-size:13px;font-weight:800;color:var(--sub);background:#f3f1ec;text-align:center;transition:all .12s;cursor:pointer}
.sec-tab.on{background:var(--navy);color:#fff}
.cpt-box{background:#fff;border:1px solid var(--line);border-top:none;border-radius:0 0 14px 14px;padding:22px 20px}

/* role classifier */
.sent{font-size:18px;line-height:1.7;text-align:center;padding:24px 8px 20px;letter-spacing:-.3px}
.sent mark{background:none;color:var(--accent);font-weight:800;border-bottom:2px solid var(--accent);padding:0 1px}
.choices{display:grid;gap:8px}
.choices.c3{grid-template-columns:repeat(3,1fr)}
.choices.c4{grid-template-columns:repeat(4,1fr)}
.choices.c2{grid-template-columns:repeat(2,1fr)}
.ch{padding:14px 6px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:800;font-size:14px;transition:border-color .12s,background .12s;text-align:center}
.ch small{display:block;font-size:11px;font-weight:600;color:var(--mute);margin-top:2px}
.ch:hover:not([disabled]){border-color:var(--navy)}
.ch.correct{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.ch.wrong{border-color:var(--no);background:var(--no-soft);color:var(--no)}
.ch[disabled]{cursor:default}

/* speed */
.speed-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.timebar{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.timebar div{height:100%;background:var(--navy);transition:width 1s linear}
.timebar.warn div{background:var(--no)}
.tnum{font-weight:800;font-size:15px;min-width:38px;text-align:right}
.speed-card{position:relative}
.flash-ok{animation:fok .35s}
.flash-no{animation:fno .35s}
@keyframes fok{0%{box-shadow:0 0 0 0 rgba(29,134,86,.45)}100%{box-shadow:0 0 0 14px rgba(29,134,86,0)}}
@keyframes fno{0%{box-shadow:0 0 0 0 rgba(196,65,58,.45)}100%{box-shadow:0 0 0 14px rgba(196,65,58,0)}}
.last{min-height:22px;text-align:center;font-size:13px;margin-top:12px;color:var(--sub)}

/* word blocks */
.zone{min-height:62px;border:1px dashed #c8c3b7;border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;margin-bottom:14px;background:#fcfbf9}
.zone .ph{color:var(--mute);font-size:13px;padding:8px 4px}
.pool{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.blk{padding:9px 13px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:15px;box-shadow:0 1px 0 var(--line)}
.blk:hover{border-color:var(--navy)}
.blk.used{visibility:hidden}
.zone .blk{background:var(--navy);border-color:var(--navy);color:#fff}

/* exam */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filters button{padding:7px 12px;border-radius:8px;font-size:13px;font-weight:700;background:#fff;border:1px solid var(--line);color:var(--sub)}
.filters button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.grid{display:grid;grid-template-columns:repeat(15,1fr);gap:4px;margin-bottom:14px}
.grid button{height:32px;border-radius:6px;font-size:11px;font-weight:800;background:#fff;border:1px solid var(--line);color:var(--mute)}
.grid button.ok{background:var(--ok-soft);border-color:#a9d8bf;color:var(--ok)}
.grid button.no{background:var(--no-soft);border-color:#ecbbb7;color:var(--no)}
.grid button.cur{outline:2px solid var(--navy);outline-offset:1px;color:var(--ink)}

/* result */
.res{text-align:center;padding:36px 22px}
.res .big{font-size:56px;font-weight:800;letter-spacing:-2px;line-height:1}
.res .big small{font-size:20px;color:var(--mute);letter-spacing:0}
.res h3{font-size:19px;font-weight:800;margin:12px 0 4px}
.res p{color:var(--sub);font-size:14px}
.res .acts{justify-content:center}
.pill{display:inline-block;font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px;background:var(--gold-soft);color:#8a6a1f;margin-top:10px}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:700;z-index:60;animation:tin .2s}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

@media(max-width:600px){
  .hero{padding:22px 18px}
  .hero h1{font-size:20px}
  .kpi{padding:12px}
  .kpi .v{font-size:20px}
  .card{padding:18px 16px}
  .qtext{font-size:15px}
  .sent{font-size:15px;padding:16px 2px}
  .choices.c3{grid-template-columns:repeat(3,1fr)}
  .grid{grid-template-columns:repeat(10,1fr)}
  .st{grid-template-columns:38px 1fr auto;padding:14px}
  .st .no{font-size:18px}
  .st .rt{min-width:64px}.mbar{width:64px}
  .brand span{display:none}
  .sec-tab{font-size:12px;padding:9px 4px}
  table.t{font-size:12.5px}
}
</style>
</head>
<body>
<header class="hdr"><div class="hdr-in">
  <div class="brand" onclick="home()">
    <div class="mark">E</div>
    <div><b>EDEN Grammar Lab</b><span>중1 · Lesson 6 · Good for the Earth</span></div>
  </div>
  <div class="hdr-actions">
    <button class="lnk" onclick="home()">홈</button>
    <button class="lnk" onclick="resetAll()">초기화</button>
  </div>
</div></header>
<main class="wrap" id="app"></main>

<script>
/* =========================================================
   저장
   ========================================================= */
const KEY='edenM1L6';
const store={
  get(k,d){try{const v=localStorage.getItem(KEY+'_'+k);return v?JSON.parse(v):d;}catch(e){return d;}},
  set(k,v){try{localStorage.setItem(KEY+'_'+k,JSON.stringify(v));}catch(e){}}
};
let prog=store.get('prog',{best:{},exam:{},wrong:[]});
const save=()=>store.set('prog',prog);

/* =========================================================
   개념 데이터
   ========================================================= */
const CPT_P1=[
{tab:'기본 개념',title:'to부정사 명사적 용법이란?',body:`
<p><b class="hl">to부정사 = to + 동사원형</b><br>
문장 속에서 명사처럼 쓰이며 '~하는 것', '~하기'로 해석합니다.</p>
<div class="tw"><table class="t">
<tr><th>역할</th><th>위치</th><th>해석</th><th>예문</th></tr>
<tr><td><b>주어</b></td><td>문장 맨 앞</td><td>~하는 것은</td><td><b class="hl">To exercise</b> regularly is not easy.</td></tr>
<tr><td><b>목적어</b></td><td>동사 바로 뒤</td><td>~하는 것을</td><td>I want <b class="hl">to save</b> the Earth.</td></tr>
<tr><td><b>보어</b></td><td>be동사 뒤</td><td>~하는 것이다</td><td>Her dream is <b class="hl">to travel</b> the world.</td></tr>
</table></div>
<div class="note">⚠️ to 뒤에는 반드시 <b>동사원형</b>! to eating(✗) → to eat(✔) / to went(✗) → to go(✔)</div>`,
check:{q:'"나는 지구를 구하고 싶다." → I want ___ the Earth.',o:['save','to save','saving','saved'],a:1}},

{tab:'주어 역할',title:'to부정사가 주어일 때 — 단수 취급!',body:`
<p>to부정사가 문장 맨 앞에서 주어로 쓰일 때는 <b class="hl">언제나 단수 취급</b>합니다.<br>→ be동사는 <b>is / was</b>를 씁니다.</p>
<div class="ex">
<span class="lbl acc">주어</span><b class="hl">To exercise regularly</b> <b>is</b> not easy. (규칙적으로 운동하는 것은 쉽지 않다.)<br>
<span class="lbl acc">주어</span><b class="hl">To cook</b> can be a fun activity. (요리하는 것은 재미있는 활동이 될 수 있다.)<br>
<span class="lbl acc">주어</span><b class="hl">To protect nature</b> <b>is</b> our duty. (자연을 보호하는 것은 우리의 의무이다.)
</div>
<div class="warn-box">To clean the floor and wash the dog <b class="no-t">are</b> not easy. ✗<br>
→ To clean the floor and wash the dog <b class="ok-t">is</b> not easy. ✔<br>
(두 개의 to부정사 묶음도 단수 취급!)</div>`,
check:{q:'"건강하게 먹는 것은 중요하다." → To eat healthy ___ important.',o:['are','is','were','be'],a:1}},

{tab:'목적어 역할',title:'to부정사만 목적어로 취하는 동사들',body:`
<p>다음 동사들은 목적어로 <b class="hl">to부정사만</b> 씁니다. (동명사 -ing 불가!)</p>
<div class="tw"><table class="t">
<tr><th>동사</th><th>의미</th><th>예문</th></tr>
<tr><td><b>want</b></td><td>~하기를 원하다</td><td>I <b class="hl">want to save</b> the Earth.</td></tr>
<tr><td><b>hope</b></td><td>~하기를 바라다</td><td>We <b class="hl">hope to see</b> you soon.</td></tr>
<tr><td><b>plan</b></td><td>~할 계획이다</td><td>Ted <b class="hl">plans to go</b> camping.</td></tr>

{tab:'보어 역할',title:'to부정사가 보어일 때 — be동사 뒤',body:`

const app=document.getElementById('app');
function norm(s){return s.toLowerCase().replace(/[^a-z0-9가-힣\s\/]/g,' ').replace(/\s+/g,' ').trim();}
function ansMatch(user,ans){
  const u=norm(user);
  const list=Array.isArray(ans)?ans:[ans];
  for(const a of list){
    const parts=a.split('/').map(p=>norm(p.trim()));
    if(parts.some(p=>p&&(u===p||u.includes(p)||p.includes(u))))return true;
  }
  return false;
}
function toast(msg){
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),2000);
}

  }
  function render(){
    const q=qs[cur];if(!q){showRes6();return;}
    const answered=prog.exam[q.n]!==undefined;
    const isWr=q.type==='wr';
    const NUMS=['①','②','③','④','⑤'];
    let optsHtml='';
    if(!isWr){
      optsHtml=`<div class="opts">${q.opts.map((o,i)=>{
        let cls='opt';
        if(answered){
          if(i===q.a)cls+=' correct';
          else if(prog.exam[q.n]===false&&i===(prog.ua||{})[q.n])cls+=' wrong';
        }
        return `<button class="${cls}" onclick="__mc(${i})" ${answered?'disabled':''}><span class="m">${NUMS[i]||''}</span><span>${o}</span></button>`;
      }).join('')}</div>`;
    }else{
      optsHtml=`<div class="fld"><label>정답 입력</label><input id="wAns" placeholder="${q.hint||'정답을 입력하세요'}" ${answered?'disabled':''} autocomplete="off" autocorrect="off"></div>`;
    }
    let fbHtml='';
    if(answered){
      const ok=prog.exam[q.n];
      fbHtml=`<div class="fb ${ok?'good':'bad'}"><div class="h">${ok?'✔ 정답!':'✗ 오답'}</div><div class="a">정답: ${Array.isArray(q.a)?q.a[0]:q.a}</div><div class="exp">${q.exp}</div>${q.selfCheck?`<div style="font-size:13px;color:var(--sub);margin-top:4px">✎ 해설을 참고해 스스로 확인하세요.</div>`:''}</div>`;
    }
    app.innerHTML=`
<div class="phead"><div><div class="eyebrow">STAGE 06</div><h2>실전 50제</h2></div>
<div class="stats"><span class="stat"><b>${cur+1}</b>/${qs.length}</span><span class="stat">정답 <b>${Object.values(prog.exam).filter(v=>v).length}</b></span></div></div>
<div class="filters">
  <button class="on">전체</button>
  <button onclick="stage6(0,false)">처음부터</button>
  ${prog.wrong.length?`<button onclick="stage6(0,true)">오답만</button>`:''}
</div>
<div class="grid">${renderGrid()}</div>
<div class="card">
  <div class="qno"><span>Q${q.n}</span><span class="tag">${q.tag}</span>${isWr?'<span class="tag red">서술형</span>':''}</div>
  <div class="qtext">${q.q.replace(/\n/g,'<br>')}</div>
  ${optsHtml}${fbHtml}
</div>
<div class="acts">
  <button class="btn btn-sec" onclick="home()">← 홈</button>
  <div class="r">
    ${cur>0?`<button class="btn btn-sec" onclick="__jmp(${cur-1})">이전</button>`:''}
    ${answered?`<button class="btn btn-pri" onclick="__jmp(${cur+1<qs.length?cur+1:cur})">${cur+1<qs.length?'다음 →':'결과 보기'}</button>`:
      isWr?`<button class="btn btn-pri" onclick="__wr()">확인</button>`:''}
  </div>
</div>`;
    window.__jmp=i=>{if(i>=0&&i<qs.length){cur=i;render();}else showRes6();};
    if(isWr&&!answered){
      const inp=document.getElementById('wAns');
      if(inp){inp.focus();inp.addEventListener('keydown',e=>{if(e.key==='Enter')window.__wr();});}
    }
    window.__mc=i=>{
      if(answered)return;
      const ok=i===q.a;
      prog.exam[q.n]=ok;
      if(!prog.ua)prog.ua={};prog.ua[q.n]=i;
      if(!ok&&!prog.wrong.includes(q.n))prog.wrong.push(q.n);
      if(ok)prog.wrong=prog.wrong.filter(n=>n!==q.n);
      save();render();
    };
    window.__wr=()=>{
      const inp=document.getElementById('wAns');if(!inp)return;
      const user=inp.value.trim();
      if(!user){toast('정답을 입력해 주세요');return;}
      const ok=ansMatch(user,q.a)||!!q.selfCheck;
      prog.exam[q.n]=ok;
      if(!ok&&!prog.wrong.includes(q.n))prog.wrong.push(q.n);
      if(ok)prog.wrong=prog.wrong.filter(n=>n!==q.n);
      save();render();
    };
  }
  function showRes6(){
    const total=EXAM.length;
    const score=Object.values(prog.exam).filter(v=>v).length;
    const pct=Math.round(score/total*100);save();
    app.innerHTML=`<div class="res"><div class="big">${score}<small>/${total}</small></div><div class="pill">${pct}% 정답률</div>
    <h3>${pct>=90?'완벽해요!':pct>=80?'훌륭해요!':pct>=70?'잘했어요!':pct>=60?'조금 더 노력해요!':'개념부터 다시 잡아요!'}</h3>
    <p>실전 50제 완료</p>
    <div class="acts"><button class="btn btn-sec" onclick="home()">홈으로</button>${prog.wrong.length?`<button class="btn btn-pri" onclick="stage6(0,true)">오답 복습</button>`:''}</div></div>`;
  }
  render();
}

/* =========================================================
   오답 복습 / 초기화
   ========================================================= */
function startWrong(){
  if(!prog.wrong.length){toast('오답 문항이 없어요!');return;}
  stage6(0,true);
}
function resetAll(){
  if(!confirm('모든 기록을 초기화할까요?'))return;
  prog={best:{},exam:{},wrong:[]};save();home();toast('기록이 초기화되었어요');
}

home();
</script>
</body>
</html>
